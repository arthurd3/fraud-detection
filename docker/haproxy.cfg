global
    nbthread 1
    maxconn 4096
defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option splice-auto
    option tcp-smart-accept
    option tcp-smart-connect
frontend ft_fraud
    bind *:9999
    default_backend bk_api
backend bk_api
    balance roundrobin
    option tcp-check
    server api1 api-1:9999 check inter 2s
    server api2 api-2:9999 check inter 2s
