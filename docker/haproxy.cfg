global
    nbthread 1
    maxconn 4096
defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # Onda 12 Phase C — kernel splice() zero-copy for TCP forwarding.
    # In mode-tcp the proxy can hand the established TCP pair to the kernel,
    # avoiding the user-space copy on every byte. Safe default for tcp mode.
    option splice-auto
    # Onda 12 Phase C — tcp-smart-{accept,connect} disable Nagle's algorithm
    # and other small-packet coalescing on the accept/connect sides. In TCP
    # mode this is the documented HAProxy 3.0+ equivalent of TCP_NODELAY for
    # accepted client and backend server sockets. (The HAProxy keyword
    # "tcp-nodelay" only exists for HTTP mode and aborts startup in mode tcp.)
    option tcp-smart-accept
    option tcp-smart-connect
frontend ft_fraud
    bind *:9999
    default_backend bk_api
backend bk_api
    balance roundrobin
    option tcp-check
    server api1 api-1:9999 check inter 2s
    server api2 api-2:9999 check inter 2s
