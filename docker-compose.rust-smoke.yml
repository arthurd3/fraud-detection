name: rinha-fraud
# SMOKE local do motor de busca Rust (FD_RUST_SEARCH=1) sobre a imagem nativa
# :lapada-api-rust recém-buildada + o lapada já pushado. Mesma topologia/limits da
# submission (1.0 CPU / 350M). Só p/ validar boot + /ready + 2 oráculos pelo LB.
services:
  lapada:
    image: arthurd3/rinha-fraud:lapada-lb
    environment:
      - FD_UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - LAPADA_LISTEN=0.0.0.0:9999
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on: [api-1, api-2]
    networks: [app]
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.05", memory: "16M" }
  api-1:
    image: arthurd3/rinha-fraud:lapada-api-rust
    environment:
      - FD_SOCKET=/sockets/api1.sock
      - DATA_PATH=/data
      - FD_RUST_SEARCH=1
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "1"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.475", memory: "167M" }
  api-2:
    image: arthurd3/rinha-fraud:lapada-api-rust
    environment:
      - FD_SOCKET=/sockets/api2.sock
      - DATA_PATH=/data
      - FD_RUST_SEARCH=1
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "2"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.475", memory: "167M" }
volumes:
  sockets:
networks:
  app:
    driver: bridge
