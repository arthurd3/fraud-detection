[package]
name = "fdsearch"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"

[lib]
name = "fdsearch"
# staticlib => libfdsearch.a (linkado no native-image); rlib => testes/exemplos (agree).
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"              # evita unwinding/symbols extras no link
codegen-units = 1
