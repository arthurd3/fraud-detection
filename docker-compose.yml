name: rinha-fraud
services:
  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on: [api-1, api-2]
    networks: [app]
    # Onda 13 Phase B — cpuset pins haproxy to logical CPU 0 (mirrors what we
    # want on the Mac Mini 4-core host: one core for the LB, one for each api,
    # one for OS). Pinning eliminates kernel scheduler migrations across cores,
    # avoiding TLB flushes and L1/L2 cache invalidations on every context
    # switch — measurable benefit when each container is single-threaded.
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.15", memory: "32M" }
  api-1:
    image: docker.io/arthurd3/rinha-fraud:onda21
    # Onda 10 — KDTREE_MAX_VISITS=1500 ativa o cap de visits (relaxação) em
    # KdTree.continueDfsBBF (ver KdTree.java §MAX_VISITS_ENABLED). Budget=1500
    # foi escolhido pós-sweep 8 trials × 3 budgets {750,1500,2000}: mediana
    # +120 pts / mean +175 vs :onda9 no rig calibrado, E=0 sobre 54.100
    # (cap só dispara em ~0.5% das queries cujas visitas > 1500, sem mudar
    # top-5 já estabilizado nas primeiras ~1000 visits). Comparado a cap=750
    # (peak 5819 mas mediana 4477 com E=3) e cap=2000 (pouco efeito): 1500 é
    # o sweet-spot conservador.
    environment:
      - KDTREE_MAX_VISITS=1500
    networks: [app]
    # Onda 13 Phase B — pin api-1 to CPU 1. See haproxy comment.
    cpuset: "1"
    # Onda 13 Phase C — raise the listen backlog (net.core.somaxconn) so burst
    # accepts don't drop, enable TCP Fast Open both as server and client.
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "159M" }
  api-2:
    image: docker.io/arthurd3/rinha-fraud:onda21
    environment:
      - KDTREE_MAX_VISITS=1500
    networks: [app]
    cpuset: "2"
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "159M" }
networks:
  app:
    driver: bridge
