name: rinha-fraud
# Arquitetura lapada (FD-passing): lapada (Rust) aceita o TCP :9999 e passa o fd
# do cliente via SCM_RIGHTS pras 2 APIs (Unix sockets no volume `sockets`). A API
# (GraalVM native-image, busca KD-tree INALTERADA = E=0) recebe o fd e serve nele.
# Substitui o HAProxy: footprint menor (lapada ~MBs vs 32MB) + I/O off-data-path.
services:
  lapada:
    build: { context: ., dockerfile: Dockerfile.lapada }
    image: rinha-fraud-lapada:dev
    environment:
      - FD_UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - LAPADA_LISTEN=0.0.0.0:9999
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on: [api-1, api-2]
    networks: [app]
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.15", memory: "16M" }
  api-1:
    build: { context: ., dockerfile: Dockerfile }
    image: rinha-fraud-api:dev
    environment:
      - FD_SOCKET=/sockets/api1.sock
      - DATA_PATH=/data
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "1"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "167M" }
  api-2:
    image: rinha-fraud-api:dev   # reusa o build do api-1
    environment:
      - FD_SOCKET=/sockets/api2.sock
      - DATA_PATH=/data
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "2"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "167M" }
volumes:
  sockets:
networks:
  app:
    driver: bridge
