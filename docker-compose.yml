name: rinha-fraud
services:
  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on: [api-1, api-2]
    networks: [app]
    # Onda 13 — cpuset pin haproxy → CPU 0 (api-1 no 1, api-2 no 2, OS no 3).
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.15", memory: "32M" }
  api-1:
    # :k2-test = binário Onda 22 K2 (poolI16Sum POOL_CAP 1<<16→1<<10, fit L2 Haswell).
    image: docker.io/arthurd3/rinha-fraud:k2-test
    networks: [app]
    cpuset: "1"
    # sysctls SÓ no main (calib local). PROIBIDO na submission (Rinha #5854).
    # NB: Onda 19 (cpu_period) REVERTIDA — preview #7335 exige cpus: por service
    # (≠ auto-merge CI); cpus:+cpu_period conflitam no daemon. Ver ledger 14ª ed.
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "159M" }
  api-2:
    image: docker.io/arthurd3/rinha-fraud:k2-test
    networks: [app]
    cpuset: "2"
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    deploy:
      resources:
        limits: { cpus: "0.425", memory: "159M" }
networks:
  app:
    driver: bridge
