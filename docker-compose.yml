name: rinha-fraud
# COMPOSE DA SUBMISSION (modo lapada) — referencia IMAGENS pushadas (sem build:),
# pois a branch submission é image-only (o CI da Rinha só faz `docker compose up`).
# Copie este conteúdo para docker-compose.yml NA branch submission (ver comandos
# no hand-off). Validador da prévia OK: deploy.resources.limits.cpus por service,
# sem sysctls (Rinha #5854), sem cpu_period (sem conflito de daemon).
# Rust port (2026-06-01): api = :lapada-api-rust-pgo + FD_RUST_SEARCH=1 (motor de busca
# KD-tree em Rust, E=0 provado). ROLLBACK p/ #36: api → :lapada-api-mlock e remova
# FD_RUST_SEARCH (a mesma imagem :lapada-api-rust-pgo SEM a env cai no caminho Java).
services:
  lapada:
    image: docker.io/arthurd3/rinha-fraud:lapada-lb
    environment:
      - FD_UPSTREAMS=/sockets/api1.sock,/sockets/api2.sock
      - LAPADA_LISTEN=0.0.0.0:9999
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on: [api-1, api-2]
    networks: [app]
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.05", memory: "16M" }
  api-1:
    image: docker.io/arthurd3/rinha-fraud:lapada-api-rust-pgo
    environment:
      - FD_SOCKET=/sockets/api1.sock
      - DATA_PATH=/data
      - FD_RUST_SEARCH=1
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "1"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.475", memory: "167M" }
  api-2:
    image: docker.io/arthurd3/rinha-fraud:lapada-api-rust-pgo
    environment:
      - FD_SOCKET=/sockets/api2.sock
      - DATA_PATH=/data
      - FD_RUST_SEARCH=1
    volumes:
      - sockets:/sockets
    networks: [app]
    cpuset: "2"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits: { cpus: "0.475", memory: "167M" }
volumes:
  sockets:
networks:
  app:
    driver: bridge
